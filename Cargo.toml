[workspace]
resolver = "2"
members = [
    "crates/octlab-transport",
    "crates/octlab-protocol",
    "crates/octlab-devices",
    "crates/octlab-lab",
    "crates/octlab-server",
    "apps/desktop",
    "apps/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
