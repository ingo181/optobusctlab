[licenses]
version = 2
# Nur diese Lizenzen sind erlaubt (MIT-kompatibel, permissiv):
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    # Permissive Attribution-only-Lizenz, gleiche Familie wie Unicode-DFS-2016
    # oben. Betrifft nur die generierte Unicode-Datentabelle in unicode-ident
    # (Cargo.toml-Lizenz "(MIT OR Apache-2.0) AND Unicode-3.0"); MIT-kompatibel.
    "Unicode-3.0",
    "Zlib",
    # MPL-2.0: weak/dateibasiertes Copyleft, kommt transitiv über wry
    # (Tauris WebView-Layer, apps/desktop) - cssparser, cssparser-macros,
    # selectors (alle via wrys dom_query) sowie option-ext (via dirs).
    # Kein Problem für dieses MIT-lizenzierte Projekt, das diese Crates nur
    # unverändert nutzt statt zu forken/verändert weiterzugeben.
    "MPL-2.0",
    # BSL-1.0: Boost Software License (permissiv, OSI-approved, MIT-kompatibel -
    # NICHT zu verwechseln mit der Business Source License BUSL-1.1). Kommt
    # transitiv über leptos' server_fn → xxhash-rust (apps/web).
    "BSL-1.0",
    # CC0-1.0: Public-Domain-Widmung, voll permissiv. Kommt transitiv über
    # leptos' wasm_split_macros → base16 (apps/web).
    "CC0-1.0",
]
confidence-threshold = 0.9
# ISC, Unicode-DFS-2016 und Zlib werden aktuell von keiner Dependency genutzt -
# bewusst trotzdem gelistet (Vorrat für künftige Dependencies), kein Fehler.
# "allow" unterdrückt die sonst hier auflaufende license-not-encountered-
# Warnung dafür, ohne die Allowlist-Einträge selbst anzufassen.
unused-allowed-license = "allow"

[bans]
# optional: warnt bei mehrfachen Versionen derselben Crate
multiple-versions = "warn"