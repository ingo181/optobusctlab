[package]
name = "octlab-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
pretty_assertions = "1"
# Nur für Tests: pausierte Zeit (`start_paused`), Spec 0005.
tokio = { workspace = true, features = ["test-util"] }

# Labor-Werkzeug (rein lesend). `test = true`, damit seine Tests unter
# `cargo test --workspace` mitlaufen - Examples werden sonst nur gebaut.
[[example]]
name = "lab_probe"
test = true
