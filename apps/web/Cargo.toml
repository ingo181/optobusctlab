[package]
name = "octlab-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { workspace = true }
serde_json = "1"
wasm-bindgen = "0.2"
# Nur die web-sys-Features, die der WebSocket-Client wirklich anfasst -
# web-sys ist feature-gesplittet, jedes Feature schaltet Bindings frei.
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "Window", "Location"] }
# Panics im WASM landen sonst als nichtssagendes "unreachable executed" in
# der Browser-Konsole - der Hook übersetzt sie in lesbare Rust-Panic-Messages.
console_error_panic_hook = "0.1"
